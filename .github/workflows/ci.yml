name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The important job: prove scripts/install.sh works on a machine that is not
  # the author's. GitHub's ubuntu-24.04 runners are full VMs with systemd, PAM
  # and passwordless sudo, which is exactly what this platform needs — so the
  # installer can be exercised for real rather than mocked.
  install:
    name: install + demo + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check the environment the installer expects
        run: |
          test -d /run/systemd/system || { echo "no systemd on this runner"; exit 1; }
          command -v runuser >/dev/null || { echo "no runuser"; exit 1; }

      - name: Run the installer
        run: sudo bash scripts/install.sh --admin ciadmin --admin-pass 'ci-test-password-01'

      - name: Services came up
        run: |
          for s in kb-syncd kb-hub kb-indexer; do
            systemctl is-active --quiet "$s" || {
              echo "::error::$s is not active"; sudo journalctl -u "$s" -n 60 --no-pager; exit 1; }
          done

      - name: Hub answers on its port
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8300/ || true)
            [ "$code" = "302" ] || [ "$code" = "200" ] && exit 0
            sleep 1
          done
          echo "::error::hub never answered"; sudo journalctl -u kb-hub -n 80 --no-pager; exit 1

      - name: Installer is idempotent (second run must succeed)
        run: sudo bash scripts/install.sh --admin ciadmin

      - name: Seed the demo company
        run: sudo bash scripts/seed-demo.sh

      - name: Permission model holds (carol must not reach the restricted project)
        run: |
          sudo -u carol test -r /srv/kb/projects/acme/plan.md \
            && { echo "::error::carol can read a restricted file"; exit 1; }
          sudo -u alice test -r /srv/kb/projects/acme/plan.md \
            || { echo "::error::alice cannot read her own project file"; exit 1; }
          rows=$(sudo -u carol psql -d kb -At -c \
            "SELECT count(*) FROM kb.blocks WHERE file_path LIKE 'projects/acme/%'")
          [ "$rows" = "0" ] || { echo "::error::RLS leaked $rows rows to carol"; exit 1; }

      # Parts of tests/cli deliberately bypass the app — direct psql, chmod, and
      # symlink attempts — to prove the KERNEL enforces access rather than
      # application code. That only means anything when run as a real demo user,
      # so the venv lives somewhere world-readable and pytest runs as alice.
      # The hub answers 503 for every /stt request when no key is installed,
      # which is *before* body validation — so without a key the request-shape
      # tests (400 / 413 / tiny-body short-circuit) never reach the code they
      # are testing. A dummy key unlocks those paths and bills nothing: the
      # tests that actually call ElevenLabs are gated behind KB_STT_LIVE.
      - name: Dummy dictation key (exercises validation, never calls upstream)
        run: |
          printf 'ci_dummy_key_not_a_real_credential' | sudo tee /etc/kb/elevenlabs.key >/dev/null
          sudo chown root:root /etc/kb/elevenlabs.key
          sudo chmod 0600 /etc/kb/elevenlabs.key
          sudo systemctl restart kb-hub
          sleep 4
          systemctl is-active --quiet kb-hub || { sudo journalctl -u kb-hub -n 40 --no-pager; exit 1; }

      - name: Test dependencies
        run: |
          sudo python3 -m venv /opt/kb-testvenv
          sudo /opt/kb-testvenv/bin/python -m pip install --upgrade -q pip
          sudo /opt/kb-testvenv/bin/python -m pip install -q -r requirements-dev.txt
          sudo chmod -R a+rX /opt/kb-testvenv

      - name: CLI test suite (as the demo owner)
        run: |
          # alice must be able to reach the checkout to import conftest
          chmod a+x "$HOME" "$(dirname "$GITHUB_WORKSPACE")" "$GITHUB_WORKSPACE" || true
          sudo chmod -R a+rX "$GITHUB_WORKSPACE"
          sudo -u alice env HOME=/home/alice \
            /opt/kb-testvenv/bin/python -m pytest tests/cli -q --maxfail=5

      - name: Diagnostics on failure
        if: failure()
        run: |
          echo '--- service state ---'
          systemctl is-active kb-hub kb-syncd kb-indexer || true
          echo '--- indexer log (its own unit only; the others flood with runuser noise) ---'
          sudo journalctl -u kb-indexer -n 80 --no-pager || true
          echo '--- seeded file ownership and modes ---'
          sudo ls -la /srv/kb /srv/kb/company /srv/kb/company/dashboards || true
          sudo getfacl -p /srv/kb/company /srv/kb/company/overview.md 2>/dev/null || true
          echo '--- can kbindexer actually read the file? ---'
          sudo -u kbindexer test -r /srv/kb/company/overview.md \
            && echo 'kbindexer CAN read overview.md' || echo 'kbindexer CANNOT read overview.md'
          echo '--- what the index holds for it ---'
          sudo -u postgres psql -d kb -c \
            "SELECT path, owner_name, group_name, to_hex(mode) AS mode, to_timestamp(mtime) FROM kb.files WHERE path='company/overview.md'" || true
          sudo -u postgres psql -d kb -c \
            "SELECT line, checked, left(text,45) FROM kb.blocks WHERE file_path='company/overview.md' AND kind='task'" || true
          echo '--- on-disk truth ---'
          sudo grep -n 'Ship the knowledgebase' /srv/kb/company/overview.md || true
          sudo cat /etc/kb/kb.env || true

      - name: Uninstall the demo cleanly
        run: sudo bash scripts/seed-demo.sh --undo

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: shellcheck -S warning scripts/*.sh

  python:
    name: python syntax + import check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall -q kb_platform tests
