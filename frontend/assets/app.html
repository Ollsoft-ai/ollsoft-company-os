<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Ollsoft Company OS</title>
  <!-- The bundle is the last thing in <body>; announcing it here starts the
       download before the parser gets there. The three fonts the first paint
       sets text in are preloaded for the same reason: a font that arrives
       after the text is a reflow of the whole page. `crossorigin` is what
       makes this request identical to the one @font-face will make (fonts
       fetch in CORS mode), so it is served from the preload rather than
       fetched twice — and the URLs carry the same ?v= stamp as style.css, or
       they would be two different resources. -->
  <link rel="modulepreload" href="/static/app.js?v=1784984673475" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/ibm-plex-sans-latin-400-normal.woff2?v=0" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/ibm-plex-sans-latin-500-normal.woff2?v=0" />
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/static/fonts/ibm-plex-mono-latin-400-normal.woff2?v=0" />
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1784984673475" />
  <link rel="stylesheet" href="/static/style.css?v=1784984673475" />
  <link rel="stylesheet" href="/static/xterm.css?v=1784984673475" />
</head>
<body class="app">
  <header class="topbar">
    <button id="nav-btn" class="navbtn" data-testid="nav-btn" aria-label="Toggle file tree" title="Files (Alt+B)">☰</button>
    <span class="brand">
      <span class="brand-word"><img class="logo-word" src="/brand/logo" alt="" /><small data-brand="name">Company OS</small></span>
    </span>
    <span class="spacer"></span>
    <!-- everything on the right of the bar is a slot modules may add to; the
         agent chat is the first (Alt+C) -->
    <span id="topbar-actions" class="topbar-actions">
      <!-- (module slot: the chat is reached from the sidebar's Chats section) -->
    </span>
  </header>
  <!-- a desktop with the file panel collapsed keeps its two global controls
       in the top-left corner, over the first strip -->
  <div id="corner" class="corner" aria-label="Files and chat">
    <button id="corner-nav" class="navbtn" title="Show files (Alt+B)" aria-label="Show file tree">☰</button>
    <button class="navbtn chat-btn" title="New chat (Alt+C)" aria-label="New chat"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg></button>
  </div>
  <div id="scrim" class="scrim" aria-hidden="true"></div>
  <main class="layout">
    <aside class="sidebar">
      <!-- the search: a button that opens the palette (Ctrl/Cmd+K) — it never takes text -->
      <button id="search" class="search" data-testid="search" aria-haspopup="dialog"
              aria-label="Search files and contents" title="Search files and contents"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.4" y2="16.4"/></svg><span id="search-label">Search…</span><kbd id="search-kbd" class="search-kbd" hidden></kbd></button>
      <!-- chats and files scroll as ONE list: the chats are not a fixed
           block pinned above a scrolling tree -->
      <div class="sb-scroll" data-testid="sb-scroll">
        <!-- pinned: the ways in you chose — a file, a folder, a command —
             rows like every other row, not a strip of pills -->
        <div id="pins-title" class="pane-title pins-title" hidden>Pinned</div>
        <div id="pins" class="pins" data-testid="pins" hidden></div>
        <!-- chats: the agent conversations, first-class beside the files — a
             new one here, the recent ones to come back to (claude.ai's Recents,
             ChatGPT's list); on a desktop this is where "New chat" lives -->
        <div class="pane-title chats-title">Chats
          <button id="chats-new" class="mini chats-new" data-testid="chat-new" title="New chat (Alt+C)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg><span>New</span></button>
        </div>
        <div id="chats" class="chats" data-testid="chats" hidden></div>
        <div class="pane-title">Files
          <button id="tree-fold" class="mini" data-testid="tree-fold" title="Collapse all folders">⊟</button>
          <button id="hidden-toggle" class="mini" data-testid="hidden-toggle"
            title="Show hidden files and folders (names starting with a dot)">.*</button>
        </div>
        <div id="tree" class="tree" data-testid="tree"></div>
      </div>
      <!-- The person, bottom left, as every workspace app does it. Everything
           that used to crowd the top bar is one click behind this button:
           settings, pinned items, admin, cron, terminal, dictation history,
           shortcuts, sign out. The ids and testids are the old ones — only the home moved. -->
      <div class="sb-foot">
        <nav id="user-menu" class="user-menu" data-testid="user-menu" role="menu" hidden>
          <div class="menu-id"><span id="whoami" data-testid="whoami" title="Everything here runs as your OS account">…</span></div>
          <button id="settings-btn" data-testid="settings-btn" role="menuitem"
                  title="Settings — theme and preferences"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg><span class="btn-label">Settings</span></button>
          <button id="pins-btn" data-testid="pins-btn" role="menuitem"
                  title="Pinned items — files, folders and commands in the sidebar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l-1 6 4 3v2H6v-2l4-3z"/><line x1="12" y1="15" x2="12" y2="21"/></svg><span class="btn-label">Pinned items</span></button>
          <button id="trash-btn" data-testid="trash-btn" role="menuitem"
                  title="Trash — deleted files, and the way back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M9 6V4h6v2"/></svg><span class="btn-label">Trash</span><span class="trash-row-n" data-testid="trash-n"></span></button>
          <button id="admin-btn" data-testid="admin-btn" role="menuitem" hidden
                  title="Admin — users, groups, network"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.5 4.5 5.5v5c0 4.6 3.2 8.9 7.5 10 4.3-1.1 7.5-5.4 7.5-10v-5z"/><polyline points="9 12 11 14 15 10"/></svg><span class="btn-label">Admin</span></button>
          <button id="cron-btn" data-testid="cron-btn" role="menuitem"
                  title="Cron — your scheduled jobs"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg><span class="btn-label">Cron</span></button>
          <button id="toggleterm" data-testid="toggle-term" role="menuitem"
                  title="Terminal — toggle panel (Ctrl+`)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="6.5 9.5 9.5 12 6.5 14.5"/><line x1="12" y1="15" x2="17" y2="15"/></svg><span class="btn-label">Terminal</span></button>
          <button id="dict-hist-btn" data-testid="dict-hist-btn" role="menuitem"
                  title="Dictation history — every transcript from the last 24 hours, kept in this browser, ready to copy"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><path d="M12 7v5l4 2"/></svg><span class="btn-label">Dictation history</span></button>
          <button id="keys-btn" data-testid="keys-btn" role="menuitem"
                  title="Keyboard shortcuts (?)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.6-2.8 2.6"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><span class="btn-label">Keyboard shortcuts</span></button>
          <a href="/logout" class="logout" role="menuitem" title="Sign out"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3.5" y2="12"/></svg><span class="btn-label">Sign out</span></a>
        </nav>
        <button id="user-btn" class="user-btn" data-testid="user-btn" aria-haspopup="menu" aria-expanded="false"
                aria-controls="user-menu" title="You — settings, tools, sign out">
          <span id="user-avatar" class="avatar" aria-hidden="true">·</span>
          <span id="user-name" class="user-name">…</span>
          <span class="user-more" aria-hidden="true">⋯</span>
        </button>
      </div>
    </aside>
    <!-- drag to widen the tree; double-click restores the default width -->
    <div id="sb-resizer" class="sb-resizer" data-testid="sb-resizer" role="separator"
         aria-orientation="vertical" tabindex="0" aria-label="Resize file tree"
         title="Drag to resize · double-click to reset"></div>
    <section class="main-col">
      <section class="editor-wrap">
        <div class="doc-title-bar">
          <span id="doc-title" data-testid="doc-title">No document open</span>
          <span class="doc-title-right">
            <button id="doc-history" class="mini doc-history" data-testid="doc-history"
              title="Version history — every save, who made it, and restore" hidden></button>
            <span id="presence" class="presence" data-testid="presence" hidden></span>
            <span id="modeswitch" class="modeswitch" data-testid="modeswitch" hidden>
              <button id="mode-rich" data-testid="mode-rich" title="Rendered, editable view">Rich</button>
              <button id="mode-source" data-testid="mode-source" title="Raw markdown source">Source</button>
            </span>
            <span id="access-badge" class="access-badge" data-testid="access-badge" hidden></span>
          </span>
        </div>
        <div id="mdbar" class="mdbar" data-testid="mdbar" hidden>
          <button data-md="h1" title="Heading 1" class="mdb-txt">H1</button>
          <button data-md="h2" title="Heading 2" class="mdb-txt">H2</button>
          <button data-md="h3" title="Heading 3" class="mdb-txt">H3</button>
          <span class="mdbar-sep"></span>
          <button data-md="bold" title="Bold (Ctrl+B)"><b>B</b></button>
          <button data-md="italic" title="Italic (Ctrl+I)"><i>I</i></button>
          <button data-md="strike" title="Strikethrough"><s>S</s></button>
          <button data-md="code" title="Inline code" class="mdb-mono">&lt;/&gt;</button>
          <span class="mdbar-sep"></span>
          <button data-md="ul" title="Bulleted list"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
          <button data-md="ol" title="Numbered list" class="mdb-txt">1.</button>
          <button data-md="task" title="Task checkbox"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></button>
          <button data-md="quote" title="Quote" class="mdb-txt">❝</button>
          <span class="mdbar-sep"></span>
          <button data-md="link" title="Link"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></button>
          <!-- one upload path for everything: what a file becomes (an inline image
               or video, or a link) is decided by its type, not by the button. The
               phone gets a second button only because a picker filtered to
               media is what opens the camera and the photo library. -->
          <button data-md="photo" title="Photo or video — from the camera or your library"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
          <button data-md="attach" title="Attach a file — images and videos render inline, other files as links"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.4 11.1 12.3 20.2a5.5 5.5 0 0 1-7.8-7.8l9.2-9.2a3.7 3.7 0 0 1 5.2 5.2l-9.2 9.2a1.8 1.8 0 0 1-2.6-2.6l8.5-8.5"/></svg></button>
          <button data-md="table" title="Insert table"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/><line x1="9" y1="3" x2="9" y2="21"/></svg></button>
          <button data-md="hr" title="Divider" class="mdb-txt">―</button>
          <span class="mdbar-sep"></span>
          <button data-md="mic" aria-label="Dictate" aria-pressed="false" title="Dictate (F9) — hold to talk, or tap and tap again. The text lands where you were typing. Audio goes to ElevenLabs for transcription and is not stored there."><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="8.5" y1="22" x2="15.5" y2="22"/></svg></button>
          <input id="up-media" type="file" accept="image/*,video/*,audio/*" multiple hidden />
          <input id="up-file" type="file" multiple hidden />
        </div>
        <!-- One or more editor panes side by side. JS owns the children: every
             pane is a tab strip + its own editor host, split by a drag handle.
             The first pane carries id="tabbar"/id="editor" so single-pane
             selectors (and deep links into the app) keep working. -->
        <div id="panes" class="panes" data-testid="panes"></div>
      </section>
      <!-- The dock: a group like every other (the same strip, the same
           actions), only its place is the bottom (or a side) of the editor
           area. It keeps its historic ids. -->
      <div id="terminal-panel" class="terminal-panel pane" hidden>
        <div id="term-tabs" class="term-tabs tabbar" data-testid="term-tabs"></div>
        <div id="terminal" class="editor" data-testid="terminal"></div>
      </div>
    </section>
  </main>
  <!-- the touch keybar: the keys a phone keyboard doesn't have, under
       whichever group shows a terminal -->
  <div id="term-keys" class="term-keys" data-testid="term-keys">
    <button data-k="mic" id="tk-mic" title="Dictate into this terminal">🎤</button>
    <button data-k="esc" title="Escape">esc</button>
    <button data-k="tab" title="Tab">tab</button>
    <button data-k="stab" title="Shift+Tab">⇧tab</button>
    <button data-k="ctrl" id="tk-ctrl" title="Ctrl — arms the next key you type">ctrl</button>
    <button data-k="cc" title="Interrupt (Ctrl+C)">^C</button>
    <button data-k="left" title="Left">←</button>
    <button data-k="down" title="Down">↓</button>
    <button data-k="up" title="Up">↑</button>
    <button data-k="right" title="Right">→</button>
    <button data-k="top" title="Jump to the oldest output kept">⤒</button>
    <button data-k="live" id="tk-live" title="Back to the live output">⤓</button>
    <button data-k="copy" title="Copy the terminal selection">copy</button>
    <button data-k="paste" title="Paste from the clipboard">paste</button>
    <button data-k="fminus" title="Smaller text">A−</button>
    <button data-k="fplus" title="Bigger text">A＋</button>
  </div>
  <!-- Recording indicator. A fixed overlay, not something inline: dictation runs
       while focus is in the editor or the terminal, and the state has to stay
       visible wherever you are looking. -->
  <div id="ptt" class="ptt" data-testid="ptt" data-state="idle" hidden>
    <span class="ptt-dot" aria-hidden="true"></span>
    <span id="ptt-label" class="ptt-label">Listening…</span>
    <span id="ptt-target" class="ptt-target" data-testid="ptt-target"></span>
    <div class="ptt-meter" aria-hidden="true"><i id="ptt-bar" class="ptt-bar"></i></div>
    <button id="ptt-stop" class="mini" data-testid="ptt-stop" title="Finish and transcribe">Stop</button>
  </div>
  <!-- Live regions must already be in the DOM before anything is written to
       them; a region injected and populated in the same tick is often not
       announced at all. -->
  <p id="ptt-status" role="status" aria-live="polite" class="visually-hidden"></p>
  <p id="ptt-error" role="alert" class="visually-hidden"></p>
  <input id="up-tree" type="file" multiple hidden />
  <!-- folder picker: `webkitdirectory` is what gives each file a
       webkitRelativePath, i.e. the tree the upload has to recreate -->
  <input id="up-tree-dir" type="file" webkitdirectory multiple hidden />
  <script type="module" src="/static/app.js?v=1784984673475"></script>
</body>
</html>
