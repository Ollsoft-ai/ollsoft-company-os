<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ollsoft Company OS · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1784965855555" />
  <link rel="stylesheet" href="/static/style.css?v=1784965855555" />
</head>
<body class="login-body">
  <form id="login" class="login-card">
    <div class="login-brand">
      <h1><img class="login-logo" src="/static/logo.svg?v=1784965855555" alt="Ollsoft" /><small>Company OS</small></h1>
    </div>
    <p class="muted">Sign in with your OS account — everything here runs as you.</p>
    <input name="username" placeholder="username" autocomplete="username" autofocus />
    <input name="password" type="password" placeholder="password" autocomplete="current-password" />
    <button type="submit">Sign in</button>
    <div id="err" class="err"></div>
    <div class="login-foot">KERNEL-ENFORCED · MULTIPLAYER · AGENT-NATIVE</div>
  </form>
  <script>
    const f = document.getElementById("login");
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = new FormData(f);
      const r = await fetch("/login", { method: "POST", body });
      if (r.ok) {
        // deep link: land where the shared URL pointed — but only a same-origin
        // in-app path. Reject "//host" and "/\host" (browsers read backslash as
        // slash in http(s) URLs, so both are off-site) to block open redirects.
        const next = new URLSearchParams(location.search).get("next") || "/";
        const safe = next[0] === "/" && next[1] !== "/" && next[1] !== "\\"
          && !next.includes("\\");
        location.href = safe ? next : "/";
      }
      else {
        const j = await r.json().catch(() => ({}));
        document.getElementById("err").textContent = j.error || "Sign-in failed — check your username and password";
      }
    });
  </script>
</body>
</html>
