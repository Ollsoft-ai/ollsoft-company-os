<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ollsoft Company OS · Sign in</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v=1784984673475" />
  <link rel="stylesheet" href="/static/style.css?v=1784984673475" />
</head>
<body class="login-body">
  <!-- A real form (method + action, labelled fields with ids, autocomplete
       hints): password managers find the sign-in by those, not by looking at
       the page. Script makes it a fetch; without script, or when a manager
       submits the form itself, the hub answers the plain POST with a redirect. -->
  <form id="login" class="login-card" method="post" action="/login">
    <div class="login-brand">
      <h1><img class="login-logo" src="/brand/logo" alt="" /><small data-brand="name">Company OS</small></h1>
    </div>
    <p id="login-sub" class="muted">Sign in with your OS account — everything here runs as you.</p>
    <label class="sr-only" for="username">Username</label>
    <input id="username" name="username" type="text" placeholder="username" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus />
    <label class="sr-only" for="password">Password</label>
    <input id="password" name="password" type="password" placeholder="password"
           autocomplete="current-password" required />
    <input id="next" name="next" type="hidden" value="" />
    <button type="submit">Sign in</button>
    <a id="login-cancel" class="login-cancel" href="/" hidden>Back to your account</a>
    <div id="err" class="err" role="alert"></div>
    <div class="login-foot">KERNEL-ENFORCED · MULTIPLAYER · AGENT-NATIVE</div>
  </form>
  <script>
    const f = document.getElementById("login");
    const q = new URLSearchParams(location.search);
    // deep link: land where the shared URL pointed — but only a same-origin
    // in-app path. Reject "//host" and "/\host" (browsers read backslash as
    // slash in http(s) URLs, so both are off-site) to block open redirects.
    const next = q.get("next") || "/";
    const safe = next[0] === "/" && next[1] !== "/" && next[1] !== "\\"
      && !next.includes("\\");
    document.getElementById("next").value = safe ? next : "/";
    // ?add=1 — signing in to a second account from the account switcher; the
    // one already signed in stays signed in. ?user= fills the name in.
    if (q.get("add")) {
      document.getElementById("login-sub").textContent =
        "Add an account — the one you are signed in to stays signed in.";
      document.getElementById("login-cancel").hidden = false;
    }
    if (q.get("user")) {
      document.getElementById("username").value = q.get("user");
      document.getElementById("password").focus();
    }
    const errs = { invalid: "invalid credentials", locked: "too many failed sign-ins \u2014 try again later" };
    if (errs[q.get("error")]) document.getElementById("err").textContent = errs[q.get("error")];
    f.addEventListener("submit", async (e) => {
      e.preventDefault();
      const body = new FormData(f);
      const r = await fetch("/login", { method: "POST", body });
      if (r.ok) location.href = safe ? next : "/";
      else {
        const j = await r.json().catch(() => ({}));
        document.getElementById("err").textContent = j.error || "Sign-in failed — check your username and password";
      }
    });
  </script>
</body>
</html>
