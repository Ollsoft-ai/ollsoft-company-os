# Rotation for the platform's own logs. Installed to /etc/logrotate.d/kb.
#
# alerts.log is the monitoring record of last resort — kb-maintenance triages
# it and a human greps it when something is confusing — so it is kept longer
# than a typical service log but is still bounded. `maxsize` on top of `weekly`
# because the interesting failure mode is a loud loop, which fills a file in
# hours rather than days — plain `size` would *replace* the weekly schedule,
# leaving a quiet log unrotated forever.
/var/log/kb/alerts.log {
    weekly
    rotate 12
    maxsize 8M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}

# Written by kb-maintenance.service: the full transcript of each triage run,
# including whatever the agent decided not to act on. Worth keeping a couple of
# months so "why did it ignore that?" is answerable.
/var/log/kb/maintenance.log {
    weekly
    rotate 9
    maxsize 16M
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
}
