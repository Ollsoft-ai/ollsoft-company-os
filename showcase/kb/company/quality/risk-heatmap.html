<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;--base:#0d1626;--ink:#e9effa;--muted:#8ca1c1;--panel:#111f34;--line:#29405e;--blue:#4d9dff;--amber:#e5ae58;--red:#f2809c;--green:#2fce98}*{box-sizing:border-box}body{margin:0;padding:28px;background:var(--base);color:var(--ink);font:14px/1.4 "IBM Plex Sans","Segoe UI",sans-serif}header{max-width:1100px;margin:auto;border-bottom:1px solid var(--line);padding-bottom:20px}h1{font-size:31px;letter-spacing:-.04em;margin:0}header p{color:var(--muted);margin:6px 0 0}.layout{max-width:1100px;margin:24px auto;display:grid;grid-template-columns:460px 1fr;gap:36px}.matrix{display:grid;grid-template-columns:34px repeat(5,1fr);grid-template-rows:repeat(5,76px) 28px;gap:4px}.cell{position:relative;background:#172741;border:1px solid #29405e;display:flex;flex-wrap:wrap;align-content:flex-start;padding:6px;gap:4px}.cell[data-score^="1"],.cell[data-score="8"],.cell[data-score="9"]{background:#3b3320}.cell[data-score="10"],.cell[data-score="12"],.cell[data-score="15"],.cell[data-score="16"]{background:#4b2c33}.cell[data-score="20"],.cell[data-score="25"]{background:#642c3b}.axis{color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center}.dot{width:28px;height:28px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:10px;font-weight:800}.dot.opp{background:var(--green);color:#071810}.list{border-top:1px solid var(--line)}.risk{padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr auto;gap:12px}.risk b{color:var(--blue)}.risk .meta{color:var(--muted);font-size:12px;margin-top:4px}.score{font-size:23px;font-weight:800;color:var(--amber)}.score.high{color:var(--red)}footer{max-width:1100px;margin:20px auto;color:var(--muted);font-size:12px}@media(max-width:820px){body{padding:18px}.layout{grid-template-columns:1fr}.matrix{grid-template-columns:28px repeat(5,1fr)}}
</style></head><body><header><h1>Risk and opportunity field</h1><p>Likelihood × impact is a prioritisation aid. Treatment and review decisions remain accountable management work.</p></header><main class="layout"><div id="matrix" class="matrix"></div><div><div id="list" class="list">Loading…</div></div></main><footer>Illustrative ISO 31000-aligned workflow · not a certification assessment</footer><script>
let seq=0,pending={};addEventListener('message',e=>{let m=e.data||{};if(m.type==='kb-result'&&pending[m.id]){pending[m.id](m);delete pending[m.id]}});const send=m=>new Promise(r=>{let id=++seq;pending[id]=r;parent.postMessage({id,...m},'*')});const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));send({type:'kb-read',path:'company/quality/risk-data.json'}).then(r=>{let d=JSON.parse(r.content),m=document.getElementById('matrix');for(let impact=5;impact>=1;impact--){let a=document.createElement('div');a.className='axis';a.textContent=impact;m.append(a);for(let likelihood=1;likelihood<=5;likelihood++){let c=document.createElement('div'),score=impact*likelihood;c.className='cell';c.dataset.score=score;d.risks.filter(x=>x.impact===impact&&x.likelihood===likelihood).forEach(x=>{let dot=document.createElement('span');dot.className='dot'+(x.id[0]==='O'?' opp':'');dot.textContent=x.id;dot.title=x.title;c.append(dot)});m.append(c)}}m.append(Object.assign(document.createElement('div'),{className:'axis'}));for(let i=1;i<=5;i++)m.append(Object.assign(document.createElement('div'),{className:'axis',textContent:i}));document.getElementById('list').innerHTML=d.risks.sort((a,b)=>b.likelihood*b.impact-a.likelihood*a.impact).map(x=>{let s=x.likelihood*x.impact;return `<div class="risk"><b>${esc(x.id)}</b><div><strong>${esc(x.title)}</strong><div class="meta">${esc(x.owner)} · ${esc(x.state)} · ${esc(x.treatment)}</div></div><span class="score ${s>=12?'high':''}">${s}</span></div>`}).join('')});
</script></body></html>
