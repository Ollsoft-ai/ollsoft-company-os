<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;--base:#0d1626;--ink:#e9effa;--muted:#8ca1c1;--panel:#111f34;--line:#29405e;--blue:#4d9dff;--amber:#e5ae58;--green:#2fce98;--red:#f2809c}*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font:14px/1.4 "IBM Plex Sans","Segoe UI",sans-serif}header{padding:26px 28px 18px;display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid var(--line)}h1{font-size:29px;letter-spacing:-.035em;margin:0 0 5px}header p{margin:0;color:var(--muted)}.legend{font-size:12px;color:var(--muted);text-align:right}.legend b{color:var(--amber)}#board{display:grid;grid-template-columns:repeat(6,minmax(230px,1fr));gap:1px;background:var(--line);overflow-x:auto;padding-bottom:20px}.col{background:var(--base);min-height:620px;padding:16px 12px}.colhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px 12px}.colhead strong{font-size:13px}.colhead span{color:var(--muted);font-variant-numeric:tabular-nums}.card{background:var(--panel);border:1px solid #263c58;border-left:3px solid var(--blue);padding:14px;margin-bottom:10px;cursor:grab}.card:focus{outline:2px solid var(--blue);outline-offset:2px}.card[data-risk=high]{border-left-color:var(--red)}.card[data-risk=medium]{border-left-color:var(--amber)}.company{font-weight:700;line-height:1.25}.meta,.next,.note{color:var(--muted);font-size:12px;margin-top:7px}.value{font-size:20px;margin-top:10px;font-variant-numeric:tabular-nums}.checks{display:flex;gap:6px;margin-top:11px}.check{padding:3px 6px;border:1px solid #3a4c65;color:var(--muted);font-size:10px}.check.ok{border-color:#276f5c;color:var(--green)}.move{display:flex;justify-content:space-between;margin-top:12px}.move button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:3px 8px;cursor:pointer}.move button:hover,.move button:focus{color:var(--ink);border-color:var(--blue)}.notice{position:fixed;right:18px;bottom:18px;background:#17304e;border:1px solid var(--blue);padding:10px 14px;display:none}.error{color:var(--red)}@media(max-width:800px){header{align-items:start;flex-direction:column}.legend{text-align:left}#board{grid-template-columns:repeat(6,260px)}}
</style></head><body><header><div><h1>Customer commitment pipeline</h1><p>A commercial funnel with evidence gates—not an ISO-prescribed funnel.</p></div><div class="legend"><b>Card border</b> indicates commercial or delivery risk<br>Req = requirements reviewed · Sec = security reviewed</div></header><main id="board"><div style="padding:20px">Loading pipeline…</div></main><div id="notice" class="notice"></div><script>
let seq=0,pending={};addEventListener('message',e=>{let m=e.data||{};if(m.type==='kb-result'&&pending[m.id]){pending[m.id](m);delete pending[m.id]}});const send=m=>new Promise(r=>{let id=++seq;pending[id]=r;parent.postMessage({id,...m},'*')});const read=p=>send({type:'kb-read',path:p}),write=(p,content)=>send({type:'kb-write',path:p,content});const PATH='company/sales/.pipeline-data.json';const stages=[['new','New lead'],['qualified','Qualified'],['requirements','Requirements review'],['proposal','Proposal'],['won','Won / handover'],['lost','Lost']];let data;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>new Intl.NumberFormat('en-DE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n);
function render(){let board=document.getElementById('board');board.innerHTML=stages.map(([key,label],idx)=>{let cards=data.opportunities.filter(o=>o.stage===key),sum=cards.reduce((a,o)=>a+o.value,0);return `<section class="col" data-stage="${key}"><div class="colhead"><strong>${label}</strong><span>${money(sum)}</span></div>${cards.map(o=>card(o,idx)).join('')}</section>`}).join('');board.querySelectorAll('.card').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id);el.onkeydown=e=>{if(e.key==='ArrowLeft')move(el.dataset.id,-1);if(e.key==='ArrowRight')move(el.dataset.id,1)}});board.querySelectorAll('.col').forEach(c=>{c.ondragover=e=>e.preventDefault();c.ondrop=e=>{e.preventDefault();setStage(e.dataTransfer.getData('text/plain'),c.dataset.stage)}});board.querySelectorAll('button[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.id,Number(b.dataset.move)))}
function card(o,idx){return `<article class="card" draggable="true" tabindex="0" data-id="${esc(o.id)}" data-risk="${esc(o.risk)}"><div class="company">${esc(o.company)}</div><div class="meta">${esc(o.id)} · ${esc(o.city)} · ${esc(o.owner)}</div><div class="value">${money(o.value)}</div><div class="next">Next: ${esc(o.next)}</div><div class="note">${esc(o.note)}</div><div class="checks"><span class="check ${o.requirements?'ok':''}">Req ${o.requirements?'✓':'–'}</span><span class="check ${o.security?'ok':''}">Sec ${o.security?'✓':'–'}</span><span class="check">${esc(o.risk)} risk</span></div><div class="move"><button data-id="${esc(o.id)}" data-move="-1" ${idx===0?'disabled':''}>←</button><button data-id="${esc(o.id)}" data-move="1" ${idx===stages.length-1?'disabled':''}>→</button></div></article>`}
function move(id,delta){let o=data.opportunities.find(x=>x.id===id),i=stages.findIndex(s=>s[0]===o.stage),n=Math.max(0,Math.min(stages.length-1,i+delta));setStage(id,stages[n][0])}async function setStage(id,stage){let o=data.opportunities.find(x=>x.id===id);if(!o||o.stage===stage)return;if(['proposal','won'].includes(stage)&&!o.requirements){show('Requirements review must be recorded before commitment.',true);return}o.stage=stage;data.updated=new Date().toISOString().slice(0,10);render();let r=await write(PATH,JSON.stringify(data,null,2)+'\n');show(r.error||'Pipeline saved to its source file.',!!r.error)}function show(t,bad){let n=document.getElementById('notice');n.textContent=t;n.className='notice'+(bad?' error':'');n.style.display='block';setTimeout(()=>n.style.display='none',2800)}
read(PATH).then(r=>{try{data=JSON.parse(r.content);render()}catch(e){document.getElementById('board').innerHTML='<div class="error" style="padding:20px">Could not read pipeline data.</div>'}});
</script></body></html>
