<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:dark;--base:#0d1626;--ink:#e9effa;--muted:#8ca1c1;--panel:#111f34;--line:#29405e;--blue:#4d9dff;--amber:#e5ae58;--red:#f2809c;--green:#2fce98}*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--ink);font:14px/1.4 "IBM Plex Sans","Segoe UI",sans-serif}header{padding:26px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:end}h1{font-size:30px;letter-spacing:-.04em;margin:0}header p{color:var(--muted);margin:5px 0 0}.pulse{color:var(--green)}#board{display:grid;grid-template-columns:repeat(4,minmax(245px,1fr));gap:18px;padding:24px 28px;overflow:auto}.col{min-height:590px}.head{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px;border-bottom:2px solid var(--line);margin-bottom:12px}.head strong{font-size:16px}.count{font-variant-numeric:tabular-nums;color:var(--muted)}.count.over{color:var(--red)}.card{position:relative;background:var(--panel);border:1px solid #263c58;padding:15px 15px 13px;margin-bottom:11px;cursor:grab}.card:before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;background:var(--blue)}.card[data-class=quality]:before{background:var(--amber)}.card[data-class=security]:before{background:var(--red)}.card[data-class=customer]:before{background:var(--green)}.id{font-size:11px;color:var(--muted)}.title{font-weight:700;font-size:15px;margin:4px 0 13px}.foot{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.project{color:var(--blue);margin-top:8px;font-size:12px}.actions{display:flex;justify-content:space-between;margin-top:12px}.actions button{border:1px solid var(--line);background:transparent;color:var(--muted);padding:3px 9px;cursor:pointer}.actions button:focus,.card:focus{outline:2px solid var(--blue);outline-offset:2px}.toast{position:fixed;right:20px;bottom:20px;background:#17304e;border:1px solid var(--blue);padding:10px 14px;display:none}.bad{color:var(--red)}@media(max-width:800px){#board{grid-template-columns:repeat(4,270px)}header{align-items:start;flex-direction:column;gap:10px}}
</style></head><body><header><div><h1>Delivery control board</h1><p>Pull work through verification. WIP limits make overloaded stages visible.</p></div><div class="pulse">● live file-backed board</div></header><main id="board">Loading…</main><div id="toast" class="toast"></div><script>
let seq=0,pending={};addEventListener('message',e=>{let m=e.data||{};if(m.type==='kb-result'&&pending[m.id]){pending[m.id](m);delete pending[m.id]}});const send=m=>new Promise(r=>{let id=++seq;pending[id]=r;parent.postMessage({id,...m},'*')});const PATH='company/dashboards/delivery-board.json';const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data;
function card(c,idx){return `<article class="card" draggable="true" tabindex="0" data-id="${esc(c.id)}" data-class="${esc(c.class)}"><div class="id">${esc(c.id)}</div><div class="title">${esc(c.title)}</div><div class="foot"><span>${esc(c.owner)}</span><span>${esc(c.due)}</span></div><div class="project">${esc(c.project)}</div><div class="actions"><button data-id="${esc(c.id)}" data-d="-1" ${idx===0?'disabled':''}>←</button><button data-id="${esc(c.id)}" data-d="1" ${idx===data.columns.length-1?'disabled':''}>→</button></div></article>`}
function render(){let b=document.getElementById('board');b.innerHTML=data.columns.map((col,i)=>{let cards=data.cards.filter(c=>c.column===col.id),over=cards.length>col.limit;return `<section class="col" data-col="${col.id}"><div class="head"><strong>${esc(col.label)}</strong><span class="count ${over?'over':''}">${cards.length} / ${col.limit===99?'∞':col.limit}</span></div>${cards.map(c=>card(c,i)).join('')}</section>`}).join('');b.querySelectorAll('.card').forEach(el=>{el.ondragstart=e=>e.dataTransfer.setData('text/plain',el.dataset.id);el.onkeydown=e=>{if(e.key==='ArrowLeft')move(el.dataset.id,-1);if(e.key==='ArrowRight')move(el.dataset.id,1)}});b.querySelectorAll('.col').forEach(el=>{el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();setCol(e.dataTransfer.getData('text/plain'),el.dataset.col)}});b.querySelectorAll('button[data-d]').forEach(x=>x.onclick=()=>move(x.dataset.id,Number(x.dataset.d)))}function move(id,d){let c=data.cards.find(x=>x.id===id),i=data.columns.findIndex(x=>x.id===c.column),n=Math.max(0,Math.min(data.columns.length-1,i+d));setCol(id,data.columns[n].id)}async function setCol(id,col){let c=data.cards.find(x=>x.id===id);if(!c||c.column===col)return;c.column=col;render();let r=await send({type:'kb-write',path:PATH,content:JSON.stringify(data,null,2)+'\n'});toast(r.error||'Board saved.',!!r.error)}function toast(t,bad){let e=document.getElementById('toast');e.textContent=t;e.className='toast'+(bad?' bad':'');e.style.display='block';setTimeout(()=>e.style.display='none',2200)}send({type:'kb-read',path:PATH}).then(r=>{try{data=JSON.parse(r.content);render()}catch(e){document.getElementById('board').innerHTML='<span class="bad">Could not load board data.</span>'}});
</script></body></html>
